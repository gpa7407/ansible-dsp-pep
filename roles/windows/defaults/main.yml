---
# ===========================================================================
# virtru.dsp_pep.windows — install & configure Virtru File Services (the
# Windows file-watcher PEP: minifilter driver + virtrusvc + fe2policy).
# Windows 11 22H2+ (amd64) only.
# ===========================================================================

# --- Required (become MSI properties -> HKLM\Software\Virtru) ----------------
windows_platform_endpoint: ""          # e.g. https://platform.dsp.example.com:443 (port required; use 443)
windows_client_id: dsp-windows-filewatcher   # OIDC client for the PEP
windows_client_secret: ""              # client secret (no_log)
windows_audience: "{{ windows_client_id }}"  # for now the audience matches the client id
# ';'-delimited attribute value FQNs applied to new TDFs. Required for PEP <= 1.2
# (set at least one; can also be set later in HKLM\Software\Virtru\DefaultAttributes).
windows_default_attributes: ""

# --- Installer --------------------------------------------------------------
windows_installer_src: ""              # path on target (or URL) to virtru_file_services-x64-rel.msi
windows_state: present
windows_install_log: 'C:\Windows\Temp\virtru_file_services_install.log'

# --- Prerequisites ----------------------------------------------------------
windows_install_vc_redist: true
windows_vc_redist_url: "https://aka.ms/vs/17/release/vc_redist.x64.exe"

# Driver signing certs shipped alongside the installer. Provide paths on the
# target host; imported before the MSI so the drivers load (and to avoid the
# "install this driver anyway" prompt).
windows_import_certs: true
windows_rootca_cert_src: ""            # rootca.pem  -> <store_location>\Root
windows_testsign_cert_src: ""          # testsign.pem -> <store_location>\My
# Certificate store scope. The PEP runs as SYSTEM services, so LocalMachine is
# the robust choice; the FDE lab guide uses CurrentUser (certmgr.msc) for GUI
# installs. Set to CurrentUser to mirror that.
windows_cert_store_location: LocalMachine
# Some environments also require testsign.pem in Trusted Root; enable if needed.
windows_testsign_also_root: false

# Optional: DSP platform TLS certificate to trust (for self-signed DSP or
# non-domain-joined clients). Path on the target; imported to <store_location>\Root.
windows_dsp_platform_cert_src: ""

# Test-signing mode is required until the drivers are cross-signed by Microsoft.
# Enabling it needs Secure Boot disabled and a reboot; opt in explicitly.
windows_enable_test_signing: false

# --- Optional registry tuning ------------------------------------------------
# List of {path, name, data, type} applied with ansible.windows.win_regedit.
# See the File Services config docs for available keys (virtruflt/virtrusvc/
# fe2policy parameters).
windows_registry_settings: []

# --- Behavior ---------------------------------------------------------------
windows_reboot: true                   # allow reboots when the installer/test-signing require one
windows_reboot_timeout: 1200
# Services verified (status only) after install. FDE 1.1 lists fesfpolicy;
# older DSP docs reference fe2policy — adjust to match your PEP build.
windows_services:
  - virtruflt
  - virtrusvc
  - fesfpolicy
