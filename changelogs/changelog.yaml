ancestor: null
releases:
  1.0.0:
    changes:
      release_summary: 'Initial release of the virtru.dsp_pep collection for installing
        and configuring Virtru Data Security Platform (DSP) Policy Enforcement Points
        (PEPs), one role per PEP: desktop (Virtru Desktop on Windows/macOS), windows
        (Virtru File Services, the Windows file-watcher), outlook (the Virtru for
        Microsoft Outlook add-in for Exchange), sharepoint (the Virtru for Microsoft
        SharePoint IIS HTTP module / Module PEP on SharePoint Server 2016+), and
        sharepoint_rer (the legacy RER SharePoint PEP with the Virtru Claims Provider
        plus DSP-side values/helm configuration and document-library registration).'
    fragments:
    - 1.0.0.yml
    release_date: '2026-08-19'
